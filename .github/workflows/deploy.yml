name: Deploy to Cloudflare Workers

# 推送 main 分支或手动点 Run workflow 时，自动构建并部署到 Cloudflare。
# 需要两个仓库 Secret（Settings → Secrets and variables → Actions）：
#   CLOUDFLARE_API_TOKEN   —— 权限模板选「Edit Cloudflare Workers」
#   CLOUDFLARE_ACCOUNT_ID  —— ce72297a5f7faac96aeb087d4ad1b77e
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 先检查 Secret 是否配好，失败时给出人话提示，而不是让人对着
      # 「npx failed with exit code 1」猜。
      - name: Check Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [ -z "$CF_TOKEN" ]; then
            echo "::error title=缺少 CLOUDFLARE_API_TOKEN::仓库 Settings → Secrets and variables → Actions → New repository secret，Name 填 CLOUDFLARE_API_TOKEN，值填 Cloudflare API Token（模板 Edit Cloudflare Workers）"
            missing=1
          fi
          if [ -z "$CF_ACCOUNT" ]; then
            echo "::error title=缺少 CLOUDFLARE_ACCOUNT_ID::再加一条 Secret：Name 填 CLOUDFLARE_ACCOUNT_ID，值填 ce72297a5f7faac96aeb087d4ad1b77e"
            missing=1
          fi
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "两个 Secret 都存在（token 长度 ${#CF_TOKEN}）"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 用 npm install 而不是 npm ci：package-lock 与 package.json 偶尔会不同步
      # （新增 wrangler / workers-types 时），npm ci 会直接失败；install 会自己补齐。
      # .npmrc 里已设 legacy-peer-deps=true，这里不用再带参数。
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      # 光「非空」不代表可用：token 过期、被删、权限模板不对，都会在部署那一步
      # 才炸，日志还藏在 action 内部。这里直接用 Cloudflare API 验一遍。
      - name: Verify Cloudflare token
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          verify=$(curl -s -X GET "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CF_TOKEN")
          echo "verify: $verify"
          if ! echo "$verify" | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"; then
            echo "::error title=CLOUDFLARE_API_TOKEN 无效::token 校验未通过（已过期或被吊销）。请到 Cloudflare 后台 My Profile → API Tokens 重新生成，模板选 Edit Cloudflare Workers，然后更新仓库 Secret"
            exit 1
          fi

          account=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT" \
            -H "Authorization: Bearer $CF_TOKEN")
          if ! echo "$account" | python3 -c "import sys,json; sys.exit(0 if json.load(sys.stdin).get('success') else 1)"; then
            echo "::error title=CLOUDFLARE_ACCOUNT_ID 不对::该 token 读不到账号 $CF_ACCOUNT，请核对仓库 Secret 里的 Account ID"
            exit 1
          fi
          echo "token 与 account id 均有效"

      # 直接调项目自己装的 wrangler，不经过 wrangler-action：
      # 版本与本地一致，出错时日志就是 wrangler 的原始输出，不用再猜。
      - name: Deploy worker + assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Summary
        run: |
          echo "### 部署完成 🎉" >> $GITHUB_STEP_SUMMARY
          echo "房间链接：https://kokospace.kccogk.workers.dev/?room=你的房间号" >> $GITHUB_STEP_SUMMARY
